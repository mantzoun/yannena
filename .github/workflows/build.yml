name: CI Pipeline

on:
  push:
    branches:
      - '*'

permissions:
  id-token: write
  checks: write
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build engine
        run: make engine

      - name: Build webserver
        run: make webserver

      - name: Test
        run: make test

  deploy-test:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f deploy/engine.Dockerfile -t engine:ci .
          docker build -f deploy/webserver.Dockerfile -t webserver:ci .

      - name: Deploy containers on runner
        run: |
          sudo apt install docker-compose
          sudo mkdir /opt/deployment_home
          sudo cp config-docker.json /opt/deployment_home/config.json
          sudo cp engine.json /opt/deployment_home/
          docker-compose --env-file deploy/.env.ci -f deploy/app-compose.yaml up -d

      - name: Smoke test
        run: |
          sleep 5
          curl -f http://localhost:8080/health

  deploy-aws:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f deploy/engine.Dockerfile -t engine:ci .
          docker build -f deploy/webserver.Dockerfile -t webserver:ci .

      - name: Configure AWS credentials for OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ECR_ACCOUNT_ID }}:role/yannena-github-actions
          aws-region: eu-north-1

      - name: Push to ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | \
          docker login --username AWS --password-stdin ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
          docker tag engine:ci ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-engine:latest
          docker tag webserver:ci ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-webserver:latest
          docker push ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-engine:latest
          docker push ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-webserver:latest

      - name: Deploy on EC2
        run: |
          aws ssm send-command \
            --region eu-north-1 \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-engine:latest",
              "docker pull ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-webserver:latest",
              "docker rm -f engine webserver || true",
              "ENGINE_IMAGE=${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-engine:latest \
               WEBSERVER_IMAGE=${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com/yannena-webserver:latest \
               docker compose -f /opt/deployment_home/app-compose.yaml up -d"
            ]'
