services:
  engine:
    image: ${ENGINE_IMAGE}
    container_name: engine
    restart: always
    ports:
      - "34001:34001"
    volumes:
      - /opt/deployment_home:/engine

  webserver:
    image: ${WEBSERVER_IMAGE}
    container_name: webserver
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /opt/deployment_home:/webserver

